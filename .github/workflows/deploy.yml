name: Deploy

# Deploys main to this fork's two Embers on every push to it, a Sync fork included, and when run from
# the Actions tab: `ember` at ember.wyer.vc and `ember-1of4` at ember.1of4.xyz, each with its own R2
# bucket, since two Embers never share one. Each keeps its people, messages and files across deploys,
# and `pnpm run deploy` keeps its secrets. The custom domains are the Workers' own, added in Cloudflare,
# which deploys leave alone while wrangler.jsonc lists no routes. A new Worker gets no setup link from
# here, since this log is public: deploy it once from a terminal first, as both of these were. It needs
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets and skips without them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'sudoramz/ember-cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One Ember failing to deploy doesn't stop the other.
      fail-fast: false
      matrix:
        include:
          - worker: ember
            bucket: ember
          - worker: ember-1of4
            bucket: ember-1of4
    # One deploy of each Worker at a time. A push while one deploys waits for it rather than cancelling it mid-upload.
    concurrency:
      group: deploy-${{ matrix.worker }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi
      # Pinned to commits, as the Preview workflow's are, because this job holds the Cloudflare token.
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: steps.secrets.outputs.present == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        run: pnpm build
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        env:
          # Only this step sees the token, not the install or build scripts.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          WORKER: ${{ matrix.worker }}
          BUCKET: ${{ matrix.bucket }}
        run: |
          # wrangler.jsonc with this Ember's bucket, beside it, since its paths are the root's.
          sed "s/\"bucket_name\": \"ember\"/\"bucket_name\": \"$BUCKET\"/" wrangler.jsonc > "wrangler.$WORKER.jsonc"
          if ! grep -q "\"bucket_name\": \"$BUCKET\"" "wrangler.$WORKER.jsonc"; then
            echo "::error::wrangler.jsonc names no bucket \"ember\" to replace with $BUCKET"
            exit 1
          fi
          node apps/worker/scripts/deploy.ts --name "$WORKER" --config "wrangler.$WORKER.jsonc" --var "GIT_REVISION:${GITHUB_SHA::7}"
          url=$(jq -rn 'first(inputs | select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev")))' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler deployed $WORKER without a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $WORKER to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the deploy
        if: steps.secrets.outputs.present == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node apps/worker/scripts/check-deploy.ts "$URL"
